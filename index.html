<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>דאמפלינג קליקר 🥟</title>
    <meta name="description" content="מעצבים סקווישי, מועכים אותו, ובונים אימפריה של שקלים" />
    <meta name="theme-color" content="#bfe4f7" />
    <!-- Link preview. Gal shares this URL into WhatsApp, Telegram and YouTube
         descriptions, and without these tags every one of them renders a bare
         string with no picture.

         The canonical domain is hardcoded here on purpose, and this is the ONLY
         place in the app that does it: every scraper demands an absolute URL, so
         `base` cannot help. The retired GitHub Pages build ships the same tags —
         which is what we want, since a shared "we moved" link should still
         preview, and point at the real game.

         The card itself is public/og.png, rendered from tools/og-card.svg (see
         the comment in that file for the one-line render command). -->
    <link rel="canonical" href="https://dumplingclicker.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="דאמפלינג קליקר" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://dumplingclicker.com/" />
    <meta property="og:title" content="דאמפלינג קליקר 🥟" />
    <meta
      property="og:description"
      content="מעצבים סקווישי, מועכים אותו, ובונים אימפריה של שקלים"
    />
    <meta property="og:image" content="https://dumplingclicker.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="סקווישי כופתאה מחייך על צלחת של סיר אידוי" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="דאמפלינג קליקר 🥟" />
    <meta
      name="twitter:description"
      content="מעצבים סקווישי, מועכים אותו, ובונים אימפריה של שקלים"
    />
    <meta name="twitter:image" content="https://dumplingclicker.com/og.png" />

    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/dumpling.css" />
    <link rel="stylesheet" href="/src/styles/backdrop.css" />
  </head>
  <body>
    <div id="app">
      <button id="settings-btn" aria-label="הגדרות">⚙️</button>
      <header id="hud"></header>
      <main id="stage"></main>
      <section id="shop"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
